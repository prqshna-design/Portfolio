
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact | Prashna Rai</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <main class="camera-shell">

    <header class="camera-top">
      <span>PR ✦ DIGITAL</span>
      <span>5.0 MP · LCD</span>
      <span>♡ CONTACT</span>
    </header>

    <div class="screen-bar">
      <span>CONTACT ME</span>
      <span>IMG_0005.JPG</span>
    </div>

    <nav class="nav">
      <a href="index.html">HOME</a>
      <a href="about.html">ABOUT</a>
      <a href="skills.html">SKILLS</a>
      <a href="projects.html">PROJECTS</a>
      <a href="contact.html" class="active">CONTACT</a>
    </nav>

    <section class="page-content">

      <div class="section-head">
        <span class="eyebrow">LET'S CONNECT ♡</span>
        <h1>Get In Touch!</h1>
        <p>Have a question or want to work together? Send me a message!</p>
      </div>

      <div class="card" style="max-width:650px;margin:30px auto;padding:30px;">

        <form action="https://formsubmit.co/prqshna@gmail.com" method="POST">

          <input type="hidden" name="_subject" value="New message from Prashna's Portfolio">
          <input type="hidden" name="_captcha" value="false">

          <label for="name">Your Name</label>
          <input
            type="text"
            id="name"
            name="name"
            placeholder="Enter your name"
            required
            style="width:100%;padding:12px;margin:10px 0 20px;border-radius:10px;border:1px solid #cbb8e8;"
          >

          <label for="email">Your Email</label>
          <input
            type="email"
            id="email"
            name="email"
            placeholder="Enter your email"
            required
            style="width:100%;padding:12px;margin:10px 0 20px;border-radius:10px;border:1px solid #cbb8e8;"
          >

          <label for="message">Your Message</label>
          <textarea
            id="message"
            name="message"
            rows="6"
            placeholder="Write your message here..."
            required
            style="width:100%;padding:12px;margin:10px 0 20px;border-radius:10px;border:1px solid #cbb8e8;resize:vertical;"
          ></textarea>

          <button type="submit" class="btn">SEND MESSAGE ♡</button>

        </form>

      </div>

      <div class="section-head">
        <p>Or email me directly: <a href="mailto:prqshna@gmail.com">prqshna@gmail.com</a></p>
      </div>

    </section>

    <footer class="camera-bottom">
      <span>© 2026 PRASHNA RAI</span>
      <span>MADE WITH ♡</span>
    </footer>

  </main>

  <script src="script.js"></script>
</body>
</html>
